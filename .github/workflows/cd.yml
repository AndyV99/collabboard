name: CD

# Stages 6-9 of Standards/CI-CD Standards.md: push image, deploy to staging
# automatically, smoke check, promote to prod behind a manual gate.
#
# ---------------------------------------------------------------------------
# WHY THIS IS A SEPARATE WORKFLOW FROM ci.yml
# ---------------------------------------------------------------------------
# `ci` is the required status check on `main`, and #30 exists about the class of
# mistake where a job that should gate a merge silently cannot. Putting deploy
# jobs into that workflow would entangle the two: a deploy job in `ci`'s `needs`
# makes every PR wait for something that cannot run on a PR, and a deploy job
# outside it that still lives in the same file is an invitation to add it to the
# aggregate later without thinking. Two files, one required check, no overlap.
#
# ---------------------------------------------------------------------------
# WHY THIS CANNOT RUN FROM A FORK
# ---------------------------------------------------------------------------
# Three independent reasons, because this is the failure that hands an attacker
# a deploy credential and one mechanism is not enough:
#
#   1. The trigger is `push` to `main`. A fork's PR fires `pull_request`, which
#      this workflow does not listen for at all.
#   2. `permissions: id-token: write` is granted per job, and GitHub refuses to
#      mint an OIDC token for a workflow triggered by a fork's pull_request
#      regardless of what the file asks for.
#   3. The deploy role's trust policy conditions on
#      `sub = repo:OWNER/NAME:ref:refs/heads/main`. Even holding a token, a fork
#      run's subject does not match and AssumeRoleWithWebIdentity is refused.
#
# The third is the one that still holds if somebody edits this file, which is
# why it exists in Terraform rather than only here.
on:
  push:
    branches: [main]

  # Manual re-run of a specific commit, for the rollback path. Rolling back is
  # "deploy the previous SHA", which is only meaningful because images are
  # tagged by SHA and the tags are immutable -- see docs/adr/0015.
  workflow_dispatch:
    inputs:
      sha:
        description: 'Commit SHA to deploy. Defaults to the current ref. An image must already exist for it.'
        required: false
        type: string

# Read-only at the top. Every job that needs to mint an OIDC token widens this
# for itself, so a job added later does not silently inherit the ability to
# assume a deploy role.
permissions:
  contents: read

# Deploys queue rather than race. Two overlapping runs would both call
# UpdateService and the loser's task definition would win or lose by timing --
# `cancel-in-progress: false` because cancelling a deploy midway leaves the
# service half rolled, which is worse than waiting.
concurrency:
  group: cd-staging
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  ECR_NAMESPACE: collabboard

jobs:
  # ---------------------------------------------------------------------------
  # Is there anything to deploy to?
  # ---------------------------------------------------------------------------
  # Until an AWS account has been applied to, none of the repository variables
  # below exist, and every job after this one would fail at
  # `configure-aws-credentials` with "Could not load credentials from any
  # providers". That was the state of `main` after #103 merged: every single
  # push produced a red CD run.
  #
  # Which is a worse outcome than it looks. This repository has twice argued
  # that a permanently red gate is one people learn to route around --
  # .checkov.yml says it, .trivyignore says it -- and CD is that at the loudest
  # setting, because it notifies on every merge. The day a deploy genuinely
  # breaks, the failure would look identical to the two hundred before it.
  #
  # So: no deploy identity means skip, loudly and on purpose. Not silently --
  # a workflow that quietly does nothing is how "CD is set up" stays true on
  # paper for six months. The notice names what is missing and where the list
  # lives.
  #
  # Every required variable is checked here, before any credential is requested,
  # because a run that assumes the role and then dies on a missing
  # ECS_CLUSTER_NAME has burned an OIDC exchange to report something a string
  # comparison could have.
  preflight:
    name: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - name: Check the deploy identity and its inputs
        id: check
        env:
          AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          ECS_CLUSTER_NAME: ${{ vars.ECS_CLUSTER_NAME }}
          API_SERVICE_NAME: ${{ vars.API_SERVICE_NAME }}
          WEB_SERVICE_NAME: ${{ vars.WEB_SERVICE_NAME }}
          API_REPOSITORY_URL: ${{ vars.API_REPOSITORY_URL }}
          WEB_REPOSITORY_URL: ${{ vars.WEB_REPOSITORY_URL }}
          MIGRATE_TASK_DEFINITION: ${{ vars.MIGRATE_TASK_DEFINITION }}
          RUN_TASK_NETWORK_CONFIGURATION: ${{ vars.RUN_TASK_NETWORK_CONFIGURATION }}
          WEB_URL: ${{ vars.WEB_URL }}
        run: |
          set -euo pipefail

          required="AWS_DEPLOY_ROLE_ARN ECS_CLUSTER_NAME API_SERVICE_NAME
                    WEB_SERVICE_NAME API_REPOSITORY_URL WEB_REPOSITORY_URL
                    MIGRATE_TASK_DEFINITION RUN_TASK_NETWORK_CONFIGURATION WEB_URL"

          missing=""
          for name in $required; do
            if [ -z "${!name:-}" ]; then
              missing="${missing} ${name}"
            fi
          done

          if [ -z "$missing" ]; then
            echo 'configured=true' >> "$GITHUB_OUTPUT"
            echo "::notice title=Deploying::All deploy variables are set."
            exit 0
          fi

          echo 'configured=false' >> "$GITHUB_OUTPUT"

          # The distinction that keeps this from becoming a permanent excuse:
          # nothing configured is "not stood up yet"; SOME things configured is
          # a half-finished setup, which is a mistake somebody should see rather
          # than a state to skip past quietly.
          if [ -z "${AWS_DEPLOY_ROLE_ARN:-}" ] && [ "$(echo $missing | wc -w)" -eq 9 ]; then
            echo "::notice title=No deploy target yet::Skipping deploy. No AWS environment has been applied, so none of the deploy variables are set."
            echo 'This is expected until the staging environment exists. The variables, what each one'
            echo 'is for, and the `terraform output` that produces it are listed in'
            echo 'infra/terraform/OPERATOR-INPUTS.md section 2.6.'
            exit 0
          fi

          echo "::error title=Partially configured::Some deploy variables are set and these are not:${missing}"
          echo 'A half-configured pipeline is a mistake rather than a state to skip past. See'
          echo 'infra/terraform/OPERATOR-INPUTS.md section 2.6 for the full list and its sources.'
          exit 1

  # ---------------------------------------------------------------------------
  # Build and push. One job, both images, because they share the login and the
  # SHA and splitting them would double the OIDC exchange for no parallelism
  # worth having at this size.
  # ---------------------------------------------------------------------------
  build:
    name: build and push
    needs: preflight
    if: needs.preflight.outputs.configured == 'true'
    # An arm64 runner, because the task definitions declare ARM64 (#120) and
    # the two images reach that differently. apps/api cross-compiles -- CGO is
    # off, so Go targets arm64 from any builder for free -- but apps/web cannot:
    # `next build`'s standalone output traces sharp's native binding, and npm
    # picks that variant from the platform it installs on. Cross-building the
    # web image would ship an x64 `.node` inside an arm64 image and fail at
    # runtime rather than at build.
    #
    # Emulating arm64 on an x64 runner would work and would turn a two-minute
    # `npm ci && next build` into something closer to fifteen. Native is
    # simpler and, on a public repository, free.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    environment: staging
    permissions:
      contents: read
      # The one grant that matters. Job-scoped, not workflow-scoped.
      id-token: write
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - name: Resolve the commit to deploy
        id: resolve
        env:
          REQUESTED: ${{ inputs.sha }}
          CURRENT: ${{ github.sha }}
        run: |
          set -euo pipefail
          SHA="${REQUESTED:-$CURRENT}"
          # Full 40-character SHA, never the short form and never a branch
          # name. A tag is the answer to "what is running", and an ambiguous
          # tag makes that question unanswerable during an incident.
          if ! [[ "$SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error title=Bad SHA::'$SHA' is not a full 40-character commit SHA."
            exit 1
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.resolve.outputs.sha }}

      # A runner on the wrong architecture must fail the build, not produce a
      # silently wrong image. Without this the web image would build happily on
      # an x64 runner, push, deploy, and die at task start with an exec format
      # error that names no architecture -- ten minutes into an apply, in the
      # one failure mode #120 exists to prevent.
      - name: Fail if the runner cannot build the target architecture natively
        run: |
          set -euo pipefail
          arch="$(uname -m)"
          if [ "$arch" != "aarch64" ]; then
            echo "::error title=Wrong runner architecture::This job builds ARM64 images natively and is running on ${arch}."
            echo 'The task definitions declare ARM64 (infra/terraform/modules/ecs/main.tf).'
            echo 'Either restore an arm64 runner, or change both Dockerfiles and cpu_architecture together.'
            exit 1
          fi
          echo "runner architecture: ${arch}"

      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          # Names the run in CloudTrail, so "who deployed this" is answerable
          # from the audit log rather than by correlating timestamps.
          role-session-name: cd-${{ github.run_id }}

      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr

      - uses: docker/setup-buildx-action@v4

      # Both images are built for the architecture the task definitions declare.
      # A mismatch is not a build failure -- the image builds fine -- it is a
      # task that dies at start with an exec format error, which reads like a
      # broken image rather than like a wrong platform.
      - name: Build and push the API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_NAMESPACE }}/api:${{ steps.resolve.outputs.sha }}
          # GitHub's own cache, not a registry cache. A registry cache would
          # write cache manifests into the ECR repository, which is
          # `IMMUTABLE` and lifecycle-managed to keep the last 30 tagged
          # images -- cache blobs would compete with rollback targets for that
          # budget. This workflow only ever runs on `main`, so the per-branch
          # scoping that makes gha cache awkward elsewhere costs nothing here.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push the web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_NAMESPACE }}/web:${{ steps.resolve.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------------------
  # Migrate BEFORE the service rolls, and stop if it fails.
  #
  # ADR 0013's ordering, enforced here rather than documented: a service rolled
  # onto a schema that has not been migrated is a service answering 500s, and a
  # migration run after the rollout is a migration racing the traffic it was
  # supposed to precede.
  # ---------------------------------------------------------------------------
  migrate:
    name: migrate
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.build.outputs.sha }}

      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: cd-migrate-${{ github.run_id }}

      - name: Run `api migrate up` and wait for it
        env:
          CLUSTER: ${{ vars.ECS_CLUSTER_NAME }}
          TASK_DEFINITION: ${{ vars.MIGRATE_TASK_DEFINITION }}
          NETWORK_CONFIGURATION: ${{ vars.RUN_TASK_NETWORK_CONFIGURATION }}
          IMAGE: ${{ vars.API_REPOSITORY_URL }}:${{ needs.build.outputs.sha }}
        run: ./scripts/ci/run-one-shot-task.sh

  # ---------------------------------------------------------------------------
  # Roll the services, then prove they are actually serving.
  # ---------------------------------------------------------------------------
  deploy:
    name: deploy staging
    needs: [build, migrate]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: staging
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.build.outputs.sha }}

      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: cd-deploy-${{ github.run_id }}

      - name: Roll the API service
        env:
          CLUSTER: ${{ vars.ECS_CLUSTER_NAME }}
          SERVICE: ${{ vars.API_SERVICE_NAME }}
          CONTAINER: api
          IMAGE: ${{ vars.API_REPOSITORY_URL }}:${{ needs.build.outputs.sha }}
        run: ./scripts/ci/deploy-service.sh

      - name: Roll the web service
        env:
          CLUSTER: ${{ vars.ECS_CLUSTER_NAME }}
          SERVICE: ${{ vars.WEB_SERVICE_NAME }}
          CONTAINER: web
          IMAGE: ${{ vars.WEB_REPOSITORY_URL }}:${{ needs.build.outputs.sha }}
        run: ./scripts/ci/deploy-service.sh

      # A service reaching steady state means ECS is happy with the task, not
      # that the product works. This is the check that would have caught a
      # WebSocket killed by the load balancer's idle timeout, and it runs
      # against the public hostname rather than from inside the VPC.
      - name: Smoke check
        env:
          WEB_URL: ${{ vars.WEB_URL }}
        run: ./scripts/ci/smoke.sh

  # ---------------------------------------------------------------------------
  # Promotion to prod.
  #
  # The shape is the point: prod does not exist yet, so this job asserts that
  # and stops. It is wired up now so the gate is real when the environment
  # arrives, rather than being invented under time pressure on the day.
  #
  # The gate is the `production` GitHub Environment's required-reviewer rule.
  # That is not decorative: GitHub will not mint an OIDC token whose `sub`
  # carries `environment:production` until the approval is given, so a prod
  # deploy role trusting that subject cannot be assumed by an unapproved run --
  # the approval is enforced by the identity provider, not by this file.
  # ---------------------------------------------------------------------------
  promote:
    name: promote to prod
    needs: [build, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Confirm a prod environment exists
        env:
          PROD_ROLE: ${{ vars.PROD_AWS_DEPLOY_ROLE_ARN }}
        run: |
          set -euo pipefail
          if [ -z "$PROD_ROLE" ]; then
            echo '::notice title=No prod environment::PROD_AWS_DEPLOY_ROLE_ARN is unset, so there is nothing to promote to.'
            echo 'infra/terraform/environments/prod does not exist yet. This job is the approval gate, wired'
            echo 'and waiting: when the environment lands, set the repository variables and remove this guard.'
            exit 0
          fi
          echo "::error title=Not implemented::A prod deploy role exists but this job does not yet deploy to it."
          exit 1
