name: CI

# PR-time quality gate only — no deploy, no image build, no registry push.
# Those arrive with the infra work; see `Standards/CI-CD Standards.md` stages 6-9.
#
# Deliberately NO `paths:` filter on the triggers. A workflow that is skipped by
# a trigger-level path filter never reports its checks at all, so any check it
# would have produced sits at "Expected — waiting for status to be reported"
# forever and blocks the PR. Instead this workflow always runs, decides what is
# affected in the `changes` job, and skips the expensive jobs individually.
# The single required status check is `ci`, which always runs. See the `ci` job.
on:
  pull_request:
  push:
    branches: [main]

# Nothing here reads or writes anything but the checkout. No repository secrets
# are referenced anywhere in this workflow, so it runs unchanged on a fork PR.
permissions:
  contents: read

# Supersede a PR's own older runs; never cancel a push.
#
# The distinction lives in the GROUP rather than in `cancel-in-progress`,
# deliberately. The previous form asked the boolean to carry it --
# `cancel-in-progress: ${{ github.event_name == 'pull_request' }}` -- and it did
# not: four of seven pushes to `main` during one merge session were cancelled
# before a single job started, because every push shares one group and a newer
# run kills the older (#149).
#
# Here a pull_request run is keyed by PR number, so a new push to the branch
# supersedes the previous run, which is what that behaviour is for. A push is
# keyed by its own run id, which is unique -- so there is never anything for it
# to cancel, whatever `cancel-in-progress` says. The property stops depending on
# how an expression is coerced.
#
# It matters because a cancelled run on a merge commit is a commit on `main`
# that nothing ever verified, and the post-merge run is the only thing that
# catches a semantic conflict between two PRs that each passed alone. That is
# not hypothetical here: #133 changed NewRouter's signature while #143 added a
# call site, git merged both without a conflict, and the result did not compile.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

env:
  # Pinned rather than floating so a toolchain release can never turn a green
  # pipeline red without a commit that says so.
  GO_VERSION: '1.26.x'
  NODE_VERSION: '22'
  GOLANGCI_LINT_VERSION: 'v2.12.2'
  GOVULNCHECK_VERSION: 'v1.6.0'
  SQLC_VERSION: '1.31.1'
  # ubuntu-latest ships a Terraform, but an unpinned one: a runner image update
  # could change the formatting rules `fmt -check` enforces without a commit
  # that says so. 1.10+ is required by the S3-native state locking in ADR 0011.
  TERRAFORM_VERSION: '1.15.8'
  # The Terraform policy scanner. Pinned for the same reason as everything
  # above it, and with one extra: the exclusion list in
  # infra/terraform/.checkov.yml is written against this version's check IDs,
  # so an unpinned upgrade could silently start skipping a check that no longer
  # exists while a new one goes unreviewed.
  CHECKOV_VERSION: '3.3.15'

jobs:
  # Cheap (~5s) job that decides which app jobs need to run. Its outputs gate
  # the `api` and `web` jobs below.
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # On pull_request, dorny/paths-filter asks the API for the PR's changed
    # files rather than diffing locally, so it needs pull-requests: read. The
    # workflow-level grant is contents: read only; this widens it for this job
    # alone rather than for every job.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      api: ${{ steps.filter.outputs.api }}
      web: ${{ steps.filter.outputs.web }}
      infra: ${{ steps.filter.outputs.infra }}
    steps:
      - uses: actions/checkout@v7

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            api:
              - 'apps/api/**'
              # The root .dockerignore decides what reaches either image build,
              # and it was in no filter at all -- so a change to it ran no app
              # job. Excluding a file `next build` or `go:embed` needs would
              # have shipped a broken image with every check green.
              - '.dockerignore'
              - '.github/workflows/ci.yml'
            web:
              - 'apps/web/**'
              - '.dockerignore'
              - '.github/workflows/ci.yml'
            infra:
              - 'infra/**'
              # Named explicitly, and not because `infra/**` obviously misses
              # it. Glob libraries differ on whether `**` crosses a
              # dot-prefixed path segment, and the consequence of guessing
              # wrong is that a change to the policy exclusions alone does not
              # run the policy check -- a suppression added without the gate
              # ever re-running against it. That is the #30 shape, so it is
              # answered by not depending on the answer.
              - 'infra/terraform/.checkov.yml'
              - '.github/workflows/ci.yml'

  # Stage order follows CI-CD Standards.md: lint first (fails fast), then unit
  # test, then build, then dependency scan.
  api:
    name: api
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          # Caches the module and build caches, keyed on go.sum.
          cache-dependency-path: apps/api/go.sum

      # 1. Lint
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          working-directory: apps/api

      # 2. Unit test. Deliberately no Postgres/Redis service containers: nothing
      # here needs them, and internal/store's database-backed tests skip when no
      # DSN resolves. The real database lives in the `integration` job below,
      # which brings its own Postgres through Testcontainers rather than making
      # this job wait on a container it does not use.
      - name: go test
        run: go test ./... -race

      # 3. Build
      - name: go build
        run: go build ./...

      # 4. Dependency scan. govulncheck is call-graph aware: it only fails on a
      # vulnerability the code actually reaches, so there is no severity knob to
      # tune here — a finding means this binary is exploitable, and that should
      # fail. Vulnerabilities in required-but-uncalled modules are reported as
      # informational and do not fail the build, which is the correct default.
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@${{ env.GOVULNCHECK_VERSION }} ./...

      # sqlc's output under internal/store/internal/gen is generated code that
      # is committed, so `go build` and `go test` pass happily against stale
      # output — someone can edit query.sql or add a migration, forget
      # `sqlc generate`, and nothing notices. `sqlc diff` exits non-zero when
      # regenerating would change a committed file, which turns that into a
      # build failure instead of a mystery a month later.
      - name: Set up sqlc
        uses: sqlc-dev/setup-sqlc@bac53b7fb28c039a6c7f5736fd1e89744021bdd6 # v5.0.0
        with:
          sqlc-version: ${{ env.SQLC_VERSION }}

      - name: sqlc diff (committed generated code is up to date)
        run: sqlc diff

  # Stage 5 of CI-CD Standards.md: real dependencies, not mocks.
  #
  # Its own job rather than a step in `api`, for two reasons. It runs in
  # parallel, so a container bring-up never delays the lint/build/vulncheck
  # feedback that `api` gives in a couple of minutes. And it reports its own
  # conclusion in the checks list, so "tenant isolation broke" is legible on the
  # PR without opening a log — folded into `api` it would read as "api failed",
  # which is where the fast checks live and is not where anyone would look.
  #
  # The cost of splitting is a second checkout and a second Go toolchain setup
  # (~20s, mostly cache-warm). That is cheap against the two properties above.
  integration:
    name: integration
    needs: changes
    # Same gate as `api`, so a web-only PR skips this too. `ci` treats a skipped
    # need as success, so skipping here does not wedge the required check.
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    # Cold run is checkout + toolchain + module download + a postgres:16-alpine
    # and a Ryuk pull + migrations + the suite: minutes, not tens of minutes.
    # 20 leaves room for a slow image pull while still failing a wedged Docker
    # daemon quickly instead of sitting on the default 360.
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          # Same key as the `api` job, so the two share one module/build cache
          # rather than each populating its own copy.
          cache-dependency-path: apps/api/go.sum

      # No `services:` block on purpose. The harness starts its own Postgres on
      # a random port through Testcontainers, so a services container would be a
      # second database nothing connects to — and it would hide the case where
      # the harness is misconfigured and silently falls back to something else.
      #
      # No TESTCONTAINERS_* configuration either. ubuntu-latest exposes the
      # daemon at the default /var/run/docker.sock, which Testcontainers finds
      # unaided. Ryuk in particular is left ENABLED: it is the backstop
      # pgtest.DB.Close documents for the case where a panic on a test goroutine
      # kills the process before any defer runs. The job's VM is destroyed
      # afterwards either way, so disabling it would buy nothing and would make
      # CI exercise a different teardown path than a developer's machine.
      #
      # -count=1 is load-bearing, not habit: setup-go restores the build cache,
      # and a cached PASS from a previous run would let this job report success
      # against a database it never started.
      #
      # -v because the point of this job is that specific assertions ran. A bare
      # `ok` line is identical whether the isolation matrix executed or the
      # package quietly had nothing to do; the subtest names in the log are the
      # evidence. Race detection is deliberately left to the `api` job's unit
      # run — nothing here spawns a goroutine, so -race would only slow the
      # container-bound suite down.
      - name: go test -tags=integration
        run: go test -tags=integration -count=1 -v ./...

  web:
    name: web
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: npm ci
        run: npm ci

      # 1. Lint
      - name: eslint
        run: npm run lint

      # 2. Unit test
      - name: vitest
        run: npm test

      # 3. Build. Next's incremental cache makes a warm build meaningfully
      # faster; a stale entry only costs a full rebuild, never a wrong result.
      - name: Restore Next.js build cache
        uses: actions/cache@v6
        with:
          path: apps/web/.next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('apps/web/package-lock.json') }}-${{ hashFiles('apps/web/**/*.[jt]s', 'apps/web/**/*.[jt]sx') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('apps/web/package-lock.json') }}-

      - name: next build
        run: npm run build

      # 4. Dependency scan, in two parts on purpose.
      #
      # Threshold: the build FAILS on high/critical advisories in production
      # dependencies only. Everything else is reported but does not fail.
      #
      # Why not fail on everything: the npm tree here is 17 production packages
      # and ~470 dev packages. Failing on every low/moderate advisory in build
      # tooling means a red pipeline arrives from a transitive dep nobody in
      # this repo can fix, on a package that never reaches a user. People learn
      # to re-run or ignore a check that cries wolf, and then it stops working
      # for the advisory that mattered. A scan people trust beats a stricter
      # scan people route around.
      #
      # What stops low/moderate rotting quietly: the report step below runs at
      # every severity and shows up as a warning on the job, and Dependabot is
      # the mechanism that actually files and PRs those upgrades (Security
      # Practices.md pairs the two deliberately).
      - name: npm audit (report, all severities)
        continue-on-error: true
        run: npm audit --audit-level=low

      - name: npm audit (gate, high+ in production deps)
        run: npm audit --omit=dev --audit-level=high

  # IaC gets the same rigor as application code, so it gets the same two cheap
  # gates the app jobs get: a formatter check and a static validity check.
  #
  # What this job deliberately does NOT do is plan. A plan needs credentials for
  # a real AWS account, and this workflow references no repository secrets at
  # all so that it runs unchanged on a fork PR. `validate` without a backend is
  # a real check — it resolves the provider schema, so an argument that does not
  # exist, a type mismatch, or a reference to a nonexistent output all fail
  # here. What it cannot catch is anything the AWS API only rejects at apply
  # time. A `plan` gate belongs with #103, which is where a deploy identity and
  # its OIDC role get designed.
  infra:
    name: infra
    needs: changes
    if: needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          # The wrapper rewrites stdout to feed step outputs, which mangles the
          # diff `fmt -check -diff` prints. Nothing here reads those outputs.
          terraform_wrapper: false

      # 1. Lint. -recursive covers bootstrap/, every module and every
      # environment in one pass.
      - name: terraform fmt
        run: terraform fmt -check -recursive -diff

      # 2. Validate, once per root module. Child modules under modules/ are
      # validated transitively as part of the root that calls them, so they need
      # no entry here -- but a module nothing calls would go unchecked, which is
      # the same silent-hole shape as #30. The `test -d` guard is what makes
      # adding environments/prod/ later require no change to this workflow.
      #
      # -backend=false skips backend initialisation, so no S3 bucket and no
      # credentials are needed. Provider plugins still download, and
      # .terraform.lock.hcl is committed, so this resolves the same provider
      # build the author validated against.
      - name: terraform validate
        run: |
          set -euo pipefail
          status=0
          for dir in bootstrap environments/*/; do
            [ -d "$dir" ] || continue
            echo "::group::terraform validate ${dir}"
            terraform -chdir="$dir" init -backend=false -input=false -no-color
            terraform -chdir="$dir" validate -no-color || status=1
            echo '::endgroup::'
          done
          exit $status

      # 3. Policy. `fmt` and `validate` are gofmt and `go build`: they prove the
      # configuration parses and that every argument exists in the provider
      # schema, and nothing about whether the infrastructure is safe. Removing
      # `aws_s3_bucket_public_access_block`, or flipping `publicly_accessible`
      # on RDS, passes both and passes review if the reviewer is reading the
      # diff's stated purpose.
      #
      # Checkov rather than tfsec/Trivy-config for one concrete reason: this
      # repository's resources overwhelmingly live in modules whose arguments
      # come from variables set by the calling environment, and Checkov
      # evaluates those (`evaluate-variables` in the config) where a
      # module-blind scanner reports them as indeterminate and skips them. It
      # also has an inline `#checkov:skip=ID:reason` syntax, which is what lets
      # a deliberate exclusion sit beside the resource it excuses rather than in
      # a list far away.
      #
      # No credentials, no API calls, no `plan` -- so this runs unchanged on a
      # fork PR, which matters because `plan` never has.
      #
      # The threshold, and every exclusion with its reason, live in
      # infra/terraform/.checkov.yml. There is deliberately no severity filter:
      # open-source Checkov has no severities, so filtering by one would be
      # filtering by nothing.
      # Installed and pinned here rather than run through
      # bridgecrewio/checkov-action, and that is not a style preference. That
      # action's pinned tag resolves to a container running **Checkov 2.0.930**,
      # which predates the AWS provider v4 split of `aws_s3_bucket` into
      # separate encryption and versioning resources -- so it reports the state
      # bucket and the attachments bucket as unencrypted and unversioned when
      # both are configured, and evaluates 188 checks where 3.3.x evaluates 360.
      # A gate that runs a four-year-old ruleset and reports green on the
      # checks it no longer understands is worse than no gate, because it is
      # believed.
      #
      # Same reasoning as scripts/gitleaks.sh: the tool version is part of what
      # the check means, so it is pinned where it can be read, and it is the
      # version the exclusions in .checkov.yml were written against.
      - name: checkov
        run: |
          python3 -m pip install --quiet --disable-pip-version-check \
            "checkov==${CHECKOV_VERSION}"
          checkov --version
          checkov \
            --directory . \
            --config-file .checkov.yml \
            --compact

      # 4. Unit test. `terraform test` with a `mock_provider` evaluates the
      # configuration end to end against a fake AWS -- no credentials, no API
      # calls, no cost -- so it runs unchanged on a fork PR alongside everything
      # else here.
      #
      # This is the only gate that covers the code paths the cost knobs create.
      # `validate` sees the configuration as staging instantiates it, so
      # nat_gateway_count = 0 and = 2 are branches nothing would otherwise ever
      # evaluate, despite ADR 0012 promising both are one-line reversals.
      #
      # Runs for any module with a tests/ directory, so adding coverage needs no
      # change here.
      - name: terraform test
        run: |
          set -euo pipefail
          status=0
          for dir in modules/*/; do
            [ -d "${dir}tests" ] || continue
            echo "::group::terraform test ${dir}"
            terraform -chdir="$dir" init -backend=false -input=false -no-color
            terraform -chdir="$dir" test -no-color || status=1
            echo '::endgroup::'
          done
          exit $status

  # Build both container images and scan them. Stages 3 and 4 of
  # CI-CD Standards.md for an artifact that already exists -- deliberately NOT
  # stages 6-9: nothing is pushed, no registry is contacted, no credential is
  # referenced, so this runs unchanged on a fork PR. The registry work is
  # cd.yml's.
  #
  # A sibling job rather than steps inside `api`/`web`, so it reports its own
  # conclusion on the PR. The cost is a second checkout; the benefit is that
  # "the image is broken" and "the tests fail" are distinguishable at a glance.
  #
  # Two things were unprotected before this. Nothing built either Dockerfile, so
  # a dependency needing a toolchain the base lacks, or a path the
  # .dockerignore now excludes, would surface at deploy time with every check
  # green -- `npm run build` on a runner is not the same build. And
  # Security Practices.md requires a Trivy scan on every built image, which
  # could not be satisfied while CI built no image.
  image:
    name: image (${{ matrix.app }})
    needs: changes
    if: needs.changes.outputs.api == 'true' || needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      # Both images are scanned even when only one changed. They share a
      # .dockerignore and a base-image bump cadence, and a scan skipped because
      # "that app did not change" is a scan that never runs on the app nobody is
      # touching -- which is exactly where an unpatched base image sits.
      fail-fast: false
      matrix:
        app: [api, web]
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build ${{ matrix.app }}
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          # Never pushed. This job holds no credential and contacts no registry.
          push: false
          # Into the runner's docker daemon, so Trivy can scan it by tag.
          load: true
          tags: collabboard-${{ matrix.app }}:ci
          # amd64 explicitly, even though the Dockerfiles default to the
          # architecture the task definitions declare. The runner is amd64, and
          # building arm64 here would mean qemu emulation -- minutes per PR --
          # to scan packages that are the same in either build. What ships is
          # built natively by cd.yml on a matching runner; this is a scan, not a
          # release artifact.
          build-args: TARGET_ARCH=amd64
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

      # Reporting, then gating -- the same split the `web` job already uses for
      # `npm audit`, and for the same reason. The first step shows everything,
      # including vulnerabilities with no fix available, so they are visible in
      # the log. The second fails the build only on what somebody could actually
      # act on.
      - name: Trivy (report everything, including unfixable)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: collabboard-${{ matrix.app }}:ci
          format: table
          severity: LOW,MEDIUM,HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: '0'

      # The gate. HIGH and CRITICAL only, and `ignore-unfixed: true`, which is
      # the answer to the question #39 asked to decide explicitly.
      #
      # A HIGH in the base image with no fixed version published is not
      # actionable: there is no bump to take, and failing on it leaves the check
      # permanently red until someone else ships a patch. A permanently red gate
      # is one people learn to route around, which costs more than the finding.
      # It stays visible in the reporting step above.
      #
      # A HIGH that IS fixable fails the build, and the fix is a base image bump
      # -- which is Dependabot's job (#22) on the pinned tags in both
      # Dockerfiles. .trivyignore is for the narrow case of a fixable finding
      # deliberately deferred; every entry there needs a date and an issue.
      - name: Trivy (gate on fixable HIGH and CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: collabboard-${{ matrix.app }}:ci
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          trivyignores: .trivyignore

  # Scans the repository for committed credentials.
  #
  # Deliberately NOT gated by `changes`, unlike api/web/infra. Those are gated
  # because they are expensive and genuinely irrelevant to an untouched app: no
  # Go file changed, so `go test` cannot have a new answer. That reasoning does
  # not transfer. A secret is not a property of a subtree -- it lands in a
  # README, a test fixture, a JSON sample, a comment in a workflow file, a
  # docs/adr page pasting a connection string "for illustration". Any path
  # filter that would be cheap enough to be worth writing is a list of the
  # places we already thought of, and the ones we thought of are not where this
  # goes wrong. The job costs well under a minute, so gating it would trade the
  # entire point of the check for nothing.
  #
  # Scans full history, not just the working tree. Those answer different
  # questions: the tree says "is a credential present now", history says "was
  # one ever committed", and only the second one matters, because a secret that
  # was committed and reverted is still on GitHub's servers and still has to be
  # rotated. A tree-only scan reports clean on exactly the incident this job
  # exists to find.
  #
  # The cost of that, honestly: gitleaks is linear in bytes of diff, and today
  # that is 132 commits / ~3.1 MB / ~0.4s. There is real growth here -- every
  # PR re-scans everything that came before it -- but at 10x the history it is
  # still seconds against a 15-minute `api` job. If it ever does start to hurt,
  # the fix is `--log-opts` from a known-clean tag, accepting that this stops
  # catching a history rewrite that plants something below the baseline. Not
  # worth buying that weakness now for a saving measured in seconds.
  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # 0 = full history. The default shallow clone would give gitleaks a
          # single commit to scan, and it would report clean, and nobody would
          # notice that it had stopped looking.
          fetch-depth: 0

      # Not gitleaks-action, and not apt/brew/`go install`: the pre-commit hook
      # has to run the identical build with the identical config, and the only
      # way to guarantee that is for both to go through one script that pins the
      # version and its checksum. An action here would drift from the hook the
      # first time either side moved, and would do it silently -- both would
      # still report "no leaks found", just about different rulesets.
      #
      # --redact keeps the matched value out of the log. A findings line still
      # carries file, line and commit, which is enough to go and look; the value
      # itself would turn a public, retained build log into a second place the
      # credential is published. The hook does not redact, because that output
      # goes to the terminal of the person who just typed it.
      #
      # No --exit-code juggling here, unlike the hook. The hook has to tell "a
      # secret is staged" apart from "the scanner failed" because it prints
      # different advice for each and gitleaks uses exit 1 for both; this job
      # just needs to go red, and whoever opens the log sees which it was.
      - name: gitleaks (full history)
        run: ./scripts/gitleaks.sh git --no-banner --redact --verbose .

  # The one job to mark as a required status check in branch protection.
  #
  # It has `if: always()` and no path gating, so it runs and reports a
  # conclusion on every single PR — including a docs-only PR where both app
  # jobs are skipped. That is what keeps path filtering from wedging a PR: the
  # required check is never the thing that got skipped.
  #
  # `skipped` needs are treated as success; only `failure` or `cancelled` fail.
  ci:
    name: ci
    # Every job above must appear here. A job missing from this list still runs
    # and still reports, but cannot block a merge -- the exact silent hole #30
    # exists to make impossible to introduce.
    needs: [changes, api, integration, web, image, infra, secret-scan]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check upstream job results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "upstream results: $RESULTS"
          if ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}; then
            echo '::error title=CI failed::At least one upstream job failed or was cancelled.'
            exit 1
          fi
          echo 'All applicable jobs passed (skipped jobs are not applicable to this change).'
