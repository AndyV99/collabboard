version: "2"

run:
  timeout: 3m
  tests: true

linters:
  default: standard
  enable:
    # Correctness
    - bodyclose
    - contextcheck
    - depguard
    - durationcheck
    - errorlint
    - noctx
    - nilerr
    - rowserrcheck
    - sqlclosecheck
    # Security
    - gosec
    # Style / maintainability
    - copyloopvar
    - goconst
    - misspell
    - nolintlint
    - revive
    - unconvert
    - wsl_v5
  settings:
    # The compiler already stops the direct bypass: the sqlc output lives in
    # internal/store/internal/gen, so no package outside internal/store can
    # import it. This closes the remaining gap — a package that gets handed a
    # pool and writes raw SQL against it, skipping the tenant context entirely.
    # See docs/adr/0001-tenant-isolation.md and internal/store/README.md.
    depguard:
      rules:
        no-database-access-outside-store:
          list-mode: lax
          files:
            - "**/internal/api/**"
            - "**/internal/realtime/**"
          deny:
            - pkg: github.com/jackc/pgx
              desc: only internal/store may talk to Postgres; go through store.WithTenant so the tenant context is set
            - pkg: database/sql
              desc: only internal/store may talk to Postgres; go through store.WithTenant so the tenant context is set
    errcheck:
      check-type-assertions: true
    goconst:
      min-occurrences: 3
    gosec:
      excludes:
        # G104 duplicates errcheck.
        - G104
    nolintlint:
      require-explanation: true
      require-specific: true
    revive:
      rules:
        - name: exported
        - name: package-comments
  exclusions:
    rules:
      # Table-driven tests reuse literals freely; magic-number-ish constants in
      # assertions are clearer inline than named.
      - path: _test\.go
        linters:
          - goconst
          - gosec

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/AndyV99/collabboard/apps/api
